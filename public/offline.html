<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>オフライン — インド式算数ゲーム</title>
<!-- Deliberately a plain file, not a Next route. The first version of this
     was a React page, and offline it rendered as raw flight data behind
     "This page couldn't load" — a fallback that needs the framework to boot
     is not a fallback. Everything here is inline: no CSS file, no fonts, no
     script, nothing to fetch. -->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;
    background:#FFF7E8;color:#1A1A2E;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",system-ui,sans-serif}
  .card{width:100%;max-width:400px;text-align:center;background:#fff;
    border:3px solid #1A1A2E;border-radius:26px;padding:30px 22px;
    box-shadow:5px 5px 0 rgba(26,26,46,.18)}
  .mark{font-size:44px;line-height:1}
  h1{font-size:23px;margin:14px 0 4px}
  .sub{font-size:13px;color:#5A5A66;letter-spacing:.04em}
  p{font-size:13px;line-height:1.75;color:#5A5A66;margin:18px 0 22px}
  .en{display:block;margin-top:8px;font-size:11.5px;color:#9A9AAA;
    font-family:system-ui,-apple-system,sans-serif}
  a{display:block;text-decoration:none;font-weight:800}
  .go{background:linear-gradient(135deg,#FF8A2B,#E23C0C);color:#fff;
    border:3px solid #1A1A2E;border-radius:16px;padding:15px;font-size:15px;
    box-shadow:4px 4px 0 #1A1A2E}
  .again{margin-top:16px;font-size:12.5px;color:#2979FF}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">🌱</div>
    <h1>オフラインです</h1>
    <div class="sub">YOU&rsquo;RE OFFLINE</div>
    <p>
      インターネットにつながっていなくても、おためしモードなら遊べます。
      記録はこの端末に保存され、次にログインしたときアカウントへ引き継がれます。
      <span class="en">You can still play in guest mode. Your progress is saved on this
      device and moves into your account next time you sign in.</span>
    </p>
    <a class="go" href="/try">▶ オフラインで遊ぶ · Play offline</a>
    <a class="again" href="/">もう一度つなぐ · Try again</a>
  </div>
</body>
</html>
